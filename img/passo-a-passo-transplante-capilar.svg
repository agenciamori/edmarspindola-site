<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 666" role="img" aria-labelledby="t1 d1" font-family="Outfit, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t1">Passo a passo da cirurgia de transplante capilar</title>
<desc id="d1">Esquema: os folículos saem da área doadora, na nuca e nas laterais, e vão para a área receptora, a região com falhas. Abaixo, as cinco etapas: anestesia local, extração dos folículos, abertura dos canais receptores, implante e orientações de alta.</desc>
<rect width="420" height="666" rx="20" fill="#f7f4ec" stroke="#ece6d6" stroke-width="2"/>
<text x="24" y="44" font-size="21" font-weight="600" fill="#0f1f35">Como é a cirurgia, em 5 etapas</text>
<text x="24" y="68" font-size="13" fill="#5b6478">Esquema ilustrativo. Não representa um paciente.</text>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#a98629"/></marker></defs>
<rect x="24" y="92" width="148" height="132" rx="16" fill="#0f1f35"/>
<text x="98" y="148" font-size="16" font-weight="600" text-anchor="middle" fill="#d2ac47">Área doadora</text>
<text x="98" y="170" font-size="13" text-anchor="middle" fill="#c7cedb">nuca e laterais</text>
<text x="98" y="190" font-size="12" text-anchor="middle" fill="#c7cedb">menos sensível à calvície</text>
<line x1="178" y1="158" x2="240" y2="158" stroke="#a98629" stroke-width="3" marker-end="url(#ar)"/>
<text x="210" y="144" font-size="12" text-anchor="middle" fill="#5b6478">um a um</text>
<rect x="248" y="92" width="148" height="132" rx="16" fill="#ffffff" stroke="#d2ac47" stroke-width="3"/>
<text x="322" y="148" font-size="16" font-weight="600" text-anchor="middle" fill="#0f1f35">Área receptora</text>
<text x="322" y="170" font-size="13" text-anchor="middle" fill="#5b6478">região com falhas</text>
<text x="322" y="190" font-size="12" text-anchor="middle" fill="#5b6478">recebe os folículos</text>
<rect x="24" y="250" width="372" height="66" rx="14" fill="#ffffff" stroke="#ece6d6" stroke-width="2"/>
<circle cx="58" cy="283" r="18" fill="#0f1f35"/>
<text x="58" y="289" font-size="17" font-weight="600" text-anchor="middle" fill="#d2ac47">1</text>
<text x="88" y="279" font-size="16" font-weight="600" fill="#0f1f35">Anestesia local</text>
<text x="88" y="300" font-size="12.5" fill="#5b6478">Nas áreas doadora e receptora</text>
<rect x="24" y="330" width="372" height="66" rx="14" fill="#ffffff" stroke="#ece6d6" stroke-width="2"/>
<circle cx="58" cy="363" r="18" fill="#0f1f35"/>
<text x="58" y="369" font-size="17" font-weight="600" text-anchor="middle" fill="#d2ac47">2</text>
<text x="88" y="359" font-size="16" font-weight="600" fill="#0f1f35">Extração dos folículos</text>
<text x="88" y="380" font-size="12.5" fill="#5b6478">Um a um, na nuca e nas laterais</text>
<rect x="24" y="410" width="372" height="66" rx="14" fill="#ffffff" stroke="#ece6d6" stroke-width="2"/>
<circle cx="58" cy="443" r="18" fill="#0f1f35"/>
<text x="58" y="449" font-size="17" font-weight="600" text-anchor="middle" fill="#d2ac47">3</text>
<text x="88" y="439" font-size="16" font-weight="600" fill="#0f1f35">Canais receptores</text>
<text x="88" y="460" font-size="12.5" fill="#5b6478">Ângulo e direção dão naturalidade</text>
<rect x="24" y="490" width="372" height="66" rx="14" fill="#ffffff" stroke="#ece6d6" stroke-width="2"/>
<circle cx="58" cy="523" r="18" fill="#0f1f35"/>
<text x="58" y="529" font-size="17" font-weight="600" text-anchor="middle" fill="#d2ac47">4</text>
<text x="88" y="519" font-size="16" font-weight="600" fill="#0f1f35">Implante dos folículos</text>
<text x="88" y="540" font-size="12.5" fill="#5b6478">Posicionados um a um nos canais</text>
<rect x="24" y="570" width="372" height="66" rx="14" fill="#ffffff" stroke="#ece6d6" stroke-width="2"/>
<circle cx="58" cy="603" r="18" fill="#0f1f35"/>
<text x="58" y="609" font-size="17" font-weight="600" text-anchor="middle" fill="#d2ac47">5</text>
<text x="88" y="599" font-size="16" font-weight="600" fill="#0f1f35">Curativo e orientações</text>
<text x="88" y="620" font-size="12.5" fill="#5b6478">Cuidados por escrito para os primeiros dias</text>
</svg>