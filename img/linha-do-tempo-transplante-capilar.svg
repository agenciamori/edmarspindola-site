<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 760" role="img" aria-labelledby="t3 d3" font-family="Outfit, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t3">Linha do tempo do transplante capilar, de 7 dias a 18 meses</title>
<desc id="d3">Oito marcos da recuperação: crostas nos primeiros dias, queda dos fios entre 2 e 6 semanas, fase silenciosa aos 2 meses, primeiros fios aos 3 meses, crescimento aos 4 e 5 meses, evolução aos 6 a 8 meses e resultado mais consolidado entre 12 e 18 meses. Os prazos variam de paciente para paciente.</desc>
<rect width="420" height="760" rx="20" fill="#f7f4ec" stroke="#ece6d6" stroke-width="2"/>
<text x="24" y="44" font-size="21" font-weight="600" fill="#0f1f35">Transplante capilar mês a mês</text>
<text x="24" y="68" font-size="13" fill="#5b6478">Faixas gerais. Seu prazo é o que a equipe indicar.</text>
<line x1="40" y1="112" x2="40" y2="700" stroke="#d2ac47" stroke-width="3" stroke-linecap="round"/>
<circle cx="40" cy="112" r="10" fill="#f7f4ec" stroke="#d2ac47" stroke-width="3"/>
<text x="68" y="106" font-size="17" font-weight="600" fill="#a98629">7 a 10 dias</text>
<text x="68" y="127" font-size="15" fill="#0f1f35">Crostas, vermelhidão e coceira</text>
<text x="68" y="146" font-size="13" fill="#5b6478">Não coçar nem esfregar a área</text>
<circle cx="40" cy="196" r="10" fill="#f7f4ec" stroke="#d2ac47" stroke-width="3"/>
<text x="68" y="190" font-size="17" font-weight="600" fill="#a98629">2 a 6 semanas</text>
<text x="68" y="211" font-size="15" fill="#0f1f35">Os fios implantados caem</text>
<text x="68" y="230" font-size="13" fill="#5b6478">O folículo permanece na pele</text>
<circle cx="40" cy="280" r="10" fill="#f7f4ec" stroke="#d2ac47" stroke-width="3"/>
<text x="68" y="274" font-size="17" font-weight="600" fill="#a98629">2 meses</text>
<text x="68" y="295" font-size="15" fill="#0f1f35">Fase silenciosa, sem mudança visível</text>
<text x="68" y="314" font-size="13" fill="#5b6478">Os folículos estão em repouso</text>
<circle cx="40" cy="364" r="10" fill="#f7f4ec" stroke="#d2ac47" stroke-width="3"/>
<text x="68" y="358" font-size="17" font-weight="600" fill="#a98629">3 meses</text>
<text x="68" y="379" font-size="15" fill="#0f1f35">Primeiros fios novos, finos e esparsos</text>
<text x="68" y="398" font-size="13" fill="#5b6478">Crescimento irregular é normal</text>
<circle cx="40" cy="448" r="10" fill="#f7f4ec" stroke="#d2ac47" stroke-width="3"/>
<text x="68" y="442" font-size="17" font-weight="600" fill="#a98629">4 meses</text>
<text x="68" y="463" font-size="15" fill="#0f1f35">Crescimento mais perceptível</text>
<text x="68" y="482" font-size="13" fill="#5b6478">Densidade ainda varia entre áreas</text>
<circle cx="40" cy="532" r="10" fill="#f7f4ec" stroke="#d2ac47" stroke-width="3"/>
<text x="68" y="526" font-size="17" font-weight="600" fill="#a98629">5 meses</text>
<text x="68" y="547" font-size="15" fill="#0f1f35">Fios engrossam aos poucos</text>
<text x="68" y="566" font-size="13" fill="#5b6478">Muitos pacientes notam a mudança</text>
<circle cx="40" cy="616" r="10" fill="#f7f4ec" stroke="#d2ac47" stroke-width="3"/>
<text x="68" y="610" font-size="17" font-weight="600" fill="#a98629">6 a 8 meses</text>
<text x="68" y="631" font-size="15" fill="#0f1f35">Evolução mais visível</text>
<text x="68" y="650" font-size="13" fill="#5b6478">Ainda não é o resultado final</text>
<circle cx="40" cy="700" r="10" fill="#0f1f35" stroke="#d2ac47" stroke-width="3"/>
<text x="68" y="694" font-size="17" font-weight="600" fill="#a98629">12 a 18 meses</text>
<text x="68" y="715" font-size="15" fill="#0f1f35">Resultado mais consolidado</text>
<text x="68" y="734" font-size="13" fill="#5b6478">Varia de paciente para paciente</text>
</svg>